<!DOCTYPE html>
<html>
<head><style>
body{margin:0;font-family:Arial;background:#f5f3ff}
.header{background:#2b0a14;color:white;text-align:center;padding:30px 20px}
.nav{background:white;text-align:center;padding:15px;box-shadow:0 2px 5px rgba(0,0,0,0.1)}
.nav a{margin:0 20px;color:#4a0a1a;text-decoration:none;font-size:16px}
.box{width:380px;margin:40px auto;background:white;padding:25px;border-radius:12px}
input,select{width:100%;padding:12px;margin:10px 0;border:1px solid #ddd;border-radius:8px;box-sizing:border-box}
button{width:100%;padding:12px;background:#c72c4d;color:white;border:none;border-radius:8px;font-size:16px}
</style></head>
<body>
<div class="header"><h2>🩸 QRAI BloodBank - ALTS</h2><p>QR Based Smart BloodBank Management System</p></div>
<div class="nav"><a href="/">Home</a><a href="/add_blood">Add Blood</a><a href="/add_donor">Add Donor</a><a href="/search_donor">Search & Find Donor</a></div>
<div class="box">
<form method="POST">
<select name="blood_group"><option>A+</option><option>A-</option><option>B+</option><option>B-</option><option>O+</option><option>O-</option><option>AB+</option><option>AB-</option></select>
<input type="number" name="units" placeholder="Units" required>
<label>Joining Date:</label><input type="date" name="joining_date" required>
<button type="submit">Save</button>
</form>
</div>
</body>
</html>
